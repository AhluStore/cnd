    function readysrc(options){
    var l = options.data.length;
    var c= 0;
    Promise.all(options.data.map(function(v,i){
     
      (function(n){
          v.then(function(){ 
            // c += ((n/l)*100);
            if(options.progress){
                options.progress(((++c/l)*100),n,l);
            }
            
        });
      })(i+1);
      return v;
    })).then(function(){
        if(options.progress){
            options.progress(c,l,l);
        }
       options.callback();
    }); 
}
